name: release

# Publishing a Go module is pushing a tag — there is no artifact to upload, and
# the module proxy pulls from the tag on first request. That makes "published"
# an unusually easy thing to get wrong: `git push origin v0.5.0` looks like it
# worked whether or not anything downstream can ever resolve it.
#
# So this workflow does the two things a bare tag does not:
#
#   1. Runs the full gate *before* the release exists, by reusing verify.yml
#      rather than a second copy that could drift. A tag must never publish
#      something unverified.
#   2. Proves a consumer can actually resolve the version, by resolving it the
#      way a consumer would — a throwaway module doing `go get` through the
#      public proxy and checksum database. This is the step that earns its
#      keep: the proxy can negative-cache a fetch made moments after a repo
#      becomes public, and the checksum database returns 500 on a first lookup,
#      and both surface as a broken build in the *platform* repository hours
#      later with nothing pointing back here.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gates as an ordinary push, run against the tagged commit.
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Pre-1.0 and minor-bumped by hand, so the shape is checked rather than
      # assumed. A tag like `0.5.0` or `v0.5` resolves to nothing for a consumer
      # and is worth catching before a release object exists for it.
      - name: Check the tag is a semver version
        run: |
          version="${GITHUB_REF_NAME}"
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag $version is not a vMAJOR.MINOR.PATCH version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      # The module path in go.mod is what a consumer imports; a rename that
      # missed it would publish a tag under a path nothing requires.
      - name: Check the module path matches this repository
        run: |
          declared=$(go list -m)
          expected="github.com/${GITHUB_REPOSITORY}"
          if [ "$declared" != "$expected" ]; then
            echo "go.mod declares $declared but this is $expected" >&2
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$version" --title "$version" --generate-notes --verify-tag

      # Resolve it exactly as the platform repository will, from a throwaway
      # module so nothing local can satisfy the import. Retried because the
      # proxy and checksum database are eventually consistent with a tag pushed
      # seconds ago — a 404 or a 500 here is normal for the first minute and a
      # hard failure after that.
      - name: Prove a consumer can resolve it
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          go mod init proxycheck >/dev/null
          module="github.com/${GITHUB_REPOSITORY}@${version}"

          for attempt in $(seq 1 12); do
            if go get "$module"; then
              echo "resolved $module on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: not resolvable yet, waiting"
            sleep 20
          done

          echo "::error::$module never became resolvable through the public proxy." >&2
          echo "The tag exists but no consumer can require it. Check the repository is public" >&2
          echo "and that the tag was pushed, then re-run this job." >&2
          exit 1
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOFLAGS: -mod=mod

  # ADR 0081 took this module out of the Platform binary. Nothing requires it in
  # platform's go.mod any more; a Platform gains it when a *user* installs it,
  # from the signed index the official registry publishes (ADR 0065, ADR 0079).
  # A release therefore reaches people through the **catalogue**, not through a
  # go.mod bump, and this dispatch is what tells the registry there is a newer
  # version to catalogue — the last hand-done step between a tag and an
  # installable module.
  #
  # It used to dispatch `core-module-release` at `platform`, which was right
  # while this module was composed in and is now wrong twice over: the bump would
  # move a require that no longer exists, and platform's core-module-bump.yml
  # refuses a module it does not already require, deliberately — adding one is a
  # human decision, not a dispatch. That dispatch could only ever have failed.
  #
  # `binaries` is a load-bearing dependency, not tidiness. The registry
  # catalogues a release by downloading the `manifest.json` from its assets, so a
  # dispatch that waited only on `release` would point the catalogue at a release
  # object whose assets are still being cross-compiled and uploaded, and the
  # entry would be refused for a module that is in fact fine. `release` stays in
  # the list because the version it proved resolvable is the version being
  # catalogued.
  #
  # A red run here costs nothing that can be undone — the tag, the release and
  # its binaries all exist by now and nothing in this job can retract them — and
  # it is how a catalogue chain that has stopped working becomes visible. That is
  # why a missing token fails rather than warns: this guard used to exit 0, which
  # meant an unset token reported green while nothing was ever sent.
  dispatch:
    needs: [release, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Tell the registry there is a new version to catalogue
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::REGISTRY_DISPATCH_TOKEN is not set — nothing was catalogued; move this module's entry in the registry's registry.yaml by hand."
            exit 1
          fi

          # The payload names the *repository*, not the module id. The catalogue
          # is keyed on the repository because a repository name does not follow
          # from an id — this one publishes a module whose id is `fanart-tv` —
          # and the repository is what locates the release to fetch a manifest
          # from.
          gh api repos/mosaic-media/registry/dispatches \
            --method POST \
            --field event_type=module-released \
            --field "client_payload[repo]=${GITHUB_REPOSITORY#*/}" \
            --field "client_payload[version]=${GITHUB_REF_NAME}"

  binaries:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # modulesign (build-manifest) lives in the platform repo; build it from a
      # checkout. The documented interim until the manifest format is extracted
      # to a public module.
      - name: Check out platform for the signing tool
        uses: actions/checkout@v4
        with:
          repository: mosaic-media/platform
          path: .platform
      - name: Build modulesign
        run: cd .platform && go build -o "$GITHUB_WORKSPACE/modulesign" ./tools/modulesign

      # CGO off, so every target cross-compiles from this one runner. The command
      # binary is cmd/module-fanart-tv, whose whole body is host.Serve.
      #
      # **The fanart.tv project key is linked in here, and here is the only
      # place it can be** (ADR 0105 rule 2). A core module's key is applied by
      # `platform`'s release workflow, because that is the workflow that links
      # the binary carrying it; ADR 0081 took this module out of that binary, so
      # the artefact that ships this key is the one cross-compiled below and
      # `FANART_PROJECT_KEY` belongs in *this* repository's secrets. The code documented
      # this policy from the start and named `./cmd/mosaic-platform` as its
      # build path, which nothing has built since the tier split — so no
      # workflow injected the key, every released binary shipped an empty one,
      # and artwork enrichment answered "fanart.tv API key not set".
      #
      # It is optional, exactly as the TMDB token is: an unset secret links an
      # empty key, the module says so on its own settings screen, and a user's
      # own key still works. What is *not* optional is the guard — a `-X` to a
      # symbol that no longer resolves is silently ignored, so the symbol path
      # spelled here is the one `linkercheck_test.go` and the test container
      # assert against a canary on every push.
      - name: Cross-compile
        env:
          FANART_PROJECT_KEY: ${{ secrets.FANART_PROJECT_KEY }}
        run: |
          mkdir -p dist
          if [ -n "${FANART_PROJECT_KEY:-}" ]; then
            echo "linking a fanart.tv project key into these binaries"
          else
            echo "::warning::FANART_PROJECT_KEY is not set — these binaries ship with no bundled key, so artwork needs a key set in Settings › fanart.tv artwork."
          fi
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${t%/*}; goarch=${t#*/}
            name="module-fanart-tv-${goos}-${goarch}"
            [ "$goos" = "windows" ] && name="${name}.exe"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build \
              -trimpath \
              -ldflags "-s -w -X github.com/mosaic-media/module-fanart-tv.defaultAPIKey=${FANART_PROJECT_KEY}" \
              -o "dist/${name}" ./cmd/module-fanart-tv
          done

      # The module tells the release what it is (id, name, roles), so the
      # manifest's identity has one source of truth — the Go code — not a copy
      # here that drifts. The version is the tag, authoritative over the build's
      # (devel).
      - name: Emit the module's identity
        run: ./dist/module-fanart-tv-linux-amd64 --mosaic-manifest > dist/identity.json

      # Join identity + SDK major + the binaries into the signed-ready manifest.
      # SDK major is 0 while the SDK is pre-1.0 (host.SDKMajor). Each binary's URL
      # points at this repository's own release assets — the module hosts its own
      # bytes, which is why the URL is declared here and not by the registry.
      - name: Build the manifest
        run: |
          pairs=()
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos=${t%/*}; goarch=${t#*/}
            pairs+=("${goos}/${goarch}=dist/module-fanart-tv-${goos}-${goarch}")
          done
          pairs+=("windows/amd64=dist/module-fanart-tv-windows-amd64.exe")
          ./modulesign build-manifest \
            -identity dist/identity.json \
            -sdk-major 0 \
            -version "${GITHUB_REF_NAME}" \
            -url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module-fanart-tv-{os}-{arch}{ext}" \
            -out dist/manifest.json \
            "${pairs[@]}"
          echo "--- manifest ---"; cat dist/manifest.json

      - name: Upload binaries and manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/module-fanart-tv-* dist/manifest.json
